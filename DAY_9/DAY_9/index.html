<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Student Management System</title>
</head>

<body>

    <div class="container mt-4">

        <!-- Student Form -->
        <fieldset class="border p-4 rounded">

            <legend class="float-none w-auto px-3">
                Student Management System
            </legend>

            <form id="studentForm" onsubmit="handleSubmit(event)">

                <div class="row mb-3">

                    <!-- Student Name -->
                    <div class="col-md-6">
                        <label for="name" class="form-label">
                            Student Name
                        </label>

                        <input type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter student name"
                            required>
                    </div>

                    <!-- Roll No -->
                    <div class="col-md-6">
                        <label for="rollno" class="form-label">
                            Roll No
                        </label>

                        <input type="text"
                            id="rollno"
                            class="form-control"
                            placeholder="Enter roll number"
                            required>
                    </div>

                </div>


                <div class="row mb-3">

                    <!-- Course -->
                    <div class="col-md-6">
                        <label for="course" class="form-label">
                            Course
                        </label>

                        <select id="course"
                            class="form-select"
                            required>

                            <option value="">Select Course</option>
                            <option value="B.Tech CSE">B.Tech CSE</option>
                            <option value="B.Tech IT">B.Tech IT</option>
                            <option value="B.Tech ECE">B.Tech ECE</option>
                            <option value="B.Tech EE">B.Tech EE</option>
                            <option value="B.Tech ME">B.Tech ME</option>
                            <option value="B.Tech AI">B.Tech AI</option>
                            <option value="B.Tech AI & ML">B.Tech AI & ML</option>

                        </select>
                    </div>


                    <!-- Marks -->
                    <div class="col-md-6">
                        <label for="marks" class="form-label">
                            Marks
                        </label>

                        <input type="number"
                            id="marks"
                            class="form-control"
                            placeholder="Enter marks"
                            
                            required>
                    </div>

                </div>


                <button type="submit" class="btn btn-primary">
                    Add Student
                </button>

            </form>

        </fieldset>


        <!-- Search -->
        <div class="mt-4">

            <input type="text"
                id="search"
                class="form-control"
                placeholder="Search by name or roll no">

        </div>


        <!-- Statistics -->
        <div class="row mt-3">

            <div class="col-md-6">
                <div class="alert alert-info">
                    Total Students:
                    <span id="totalStudents">0</span>
                </div>
            </div>

            <div class="col-md-6">
                <div class="alert alert-success">
                    Average Marks:
                    <span id="averageMarks">0</span>
                </div>
            </div>

        </div>


        <!-- Student Table -->
        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-light">

                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentTable">

                    <!-- data form js se -->

                </tbody>

            </table>

        </div>

    </div>


    <script src="index.js"></script>

</body>

</html>
